services:
  db:
    image: postgres:16
    container_name: f1obs-db
    environment:
      POSTGRES_USER: f1obs
      POSTGRES_PASSWORD: f1obs
      POSTGRES_DB: f1obs
    ports:
      - "5432:5432"
    volumes:
      - f1obs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1obs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  f1obs_pgdata:
