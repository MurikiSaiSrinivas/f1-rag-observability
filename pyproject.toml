[project]
name = "f1-rag-observability"
version = "0.1.0"
description = "Observability layer over an F1 RAG pipeline — traces, scores, flags, and debugs bad answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=6.11.0",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
    "wikipedia-api>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
