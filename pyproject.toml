[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-rag-observability"
version = "0.1.0"
description = "Observability layer over an F1 RAG pipeline — traces, scores, flags, and debugs bad answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "wikipedia-api>=0.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
